<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-third-project To Do App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="img__wrapper">

</div>

<main class="todo__app">
 <div class="todo__container">
    <div class="todo__header">
        <h1 class="todo__title">TODO</h1>
        <button class="todo__theme-toggle"></button>
    </div>

    <div class="todo__input-wrapper">
        <span></span>
        <input class="todo__input" type="text" placeholder="Create a new todo...">
    </div>


    <div class="todo__list-wrapper">
        <ul class="todo__list">

          <li class="todo__item   todo__item--completed">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">Complete online JavaScript course</p>
          </li>  

          <li class="todo__item">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">Jog around the park 3x</p>
          </li> 


          <li class="todo__item">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">10 minutes meditation</p>
          </li> 

          <li class="todo__item">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">Read for 1 hour</p>
          </li> 

          <li class="todo__item">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">Pick up groceries</p>
          </li> 

            <li class="todo__item">
            <span class="todo__checkbox-circle"></span>
            <p class="todo__text">Complete Todo App on Frontend Mentor</p>
          </li> 
        </ul> <!-- todo__list-->

        <div class="todo__footer">
        <span class="todo__count">5 items left</span>

        <div class="todo__buttons">
          <button class="todo__button todo__button--active">All</button>
          <button class="todo__button">Active</button>
          <button class="todo__button">Completed</button>
        </div>

        <button class="todo__clear">Clear Completed</button>
        </div> <!-- todo__footer-->
    </div> <!-- todo__list-wrapper-->

    <p class="todo__subtitle">Drag and drop to reorder list</p>



 </div> <!-- todo__container-->
</main> <!-- todo__app-->

<script src="script.js"></script>    
</body>
</html>
